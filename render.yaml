# Render.com Blueprint configuration for MistriBhaiya
#
# IMPORTANT: Set SECRET_KEY, RAZORPAY_KEY_SECRET, RAZORPAY_WEBHOOK_SECRET
# in the Render Dashboard → Environment tab, NOT here.
#
# OPTION 1: Free Tier (Zero cost) — SQLite resets on restart.
#   Set DB_PATH=/tmp/mistribaiya.db
# OPTION 2: Starter Plan ($7/mo) — Persistent SQLite.
#   Set DB_PATH=/data/mistribaiya.db and uncomment the disk block below.
#
# To configure real SMS OTP: set SMS_PROVIDER=msg91, MSG91_AUTHKEY=..., MSG91_TEMPLATE_ID=...

services:
  - type: web
    name: mistribaiya-api
    runtime: docker
    plan: free # Change to starter if using persistent disk
    healthCheckPath: /healthz
    # disk: { name: data, mountPath: /data, sizeGB: 1 } # Uncomment for Render Starter ($7/mo)
    envVars:
      # SECRET_KEY: Set this in Render Dashboard → Environment (never commit a real key here)
      - { key: SECRET_KEY, value: "ec06a6bfb6cc9fda5ca9712335a9b23d324e40b0170cbb4ee2be9fad8aa32f9f" }
      - { key: DEV_MODE, value: "1" }
      - { key: DB_PATH, value: /tmp/mistribaiya.db }
      - { key: SMS_PROVIDER, value: fast2sms }
      - { key: FAST2SMS_API_KEY, value: "7qNuMPij1G9AOJzrQ6xg3pWSVml0fEventHXhZ2CULboYFdK48XSue1a6Cs8kJIWchG0OB9xF3mgvTwD" }
      - { key: CALL_PROVIDER, value: direct }
      - { key: CORS_ORIGINS, value: "https://mistribhaiya-f5a94.web.app,https://mistribhaiya-f5a94.firebaseapp.com" }
      # Razorpay — set in Dashboard:
      # RAZORPAY_KEY_ID, RAZORPAY_KEY_SECRET, RAZORPAY_WEBHOOK_SECRET
      # MSG91 — set in Dashboard:
      # MSG91_AUTHKEY, MSG91_TEMPLATE_ID
